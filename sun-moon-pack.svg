  <text x="210" y="448" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="50" font-weight="900" stroke="#24114f" stroke-width="10" paint-order="stroke">SUN &amp; MOON</text>
  <text x="210" y="490" text-anchor="middle" fill="#ffe98a" font-family="Arial,sans-serif" font-size="22" font-weight="700">10 ADDITIONAL GAME CARDS</text>
