  <circle cx="292" cy="292" r="100" fill="#b9dcff" filter="url(#glow)"/>
  <circle cx="326" cy="257" r="99" fill="#30185f"/>
  <g fill="#fff" opacity=".85"><circle cx="310" cy="150" r="5"/><circle cx="353" cy="193" r="3"/><circle cx="271" cy="124" r="3"/><circle cx="337" cy="370" r="4"/><circle cx="88" cy="402" r="3"/></g>
