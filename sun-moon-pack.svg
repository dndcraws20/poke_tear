<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 650" role="img" aria-labelledby="title desc">
  <title id="title">Sun and Moon booster pack</title>
  <desc id="desc">A blue and orange fantasy booster wrapper with a glowing sun and crescent moon.</desc>
  <defs>
    <linearGradient id="wrap" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071c5d"/><stop offset=".48" stop-color="#45217a"/><stop offset="1" stop-color="#eb5b25"/>
    </linearGradient>
    <radialGradient id="sun"><stop stop-color="#fff9b0"/><stop offset=".45" stop-color="#ffc52e"/><stop offset="1" stop-color="#f05a22"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <path fill="#d7d9ed" d="M18 12h384l-18 24 18 24-18 24 18 24H18L36 84 18 60l18-24zM18 542h384l-18 24 18 24-18 24 18 24H18l18-24-18-24 18-24z"/>
